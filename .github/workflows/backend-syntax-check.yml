name: Backend syntax and unit checks

on:
  push:
    branches:
      - ctrader-cloud
  pull_request:
    branches:
      - ctrader-cloud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Run cTrader snapshot helper unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
