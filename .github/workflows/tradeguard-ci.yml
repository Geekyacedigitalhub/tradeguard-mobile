name: TradeGuard CI

on:
  push:
    branches: [main, tradeguard-ctrader-completion, ctrader-cloud]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run backend unit tests when present
        working-directory: backend
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            if python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/tradeguard-unit-tests.log 2>&1; then
              cat /tmp/tradeguard-unit-tests.log
            else
              # Surface the failing tail as a check annotation for fast triage.
              echo "::error file=backend/tests/test_ctrader_session_selfheal.py,title=Backend unit tests failed (summary)::"
              tail -n 5 /tmp/tradeguard-unit-tests.log
              echo ""
              echo "::error file=backend/tests/test_ctrader_session_selfheal.py,title=Failing detail::"
              sed -n '/^====/,$p' /tmp/tradeguard-unit-tests.log | head -n 100
              exit 1
            fi
          else
            echo 'No backend test modules found; compile check completed.'
          fi
