name: TradeGuard CI

on:
  push:
    branches: [main, tradeguard-ctrader-completion, ctrader-cloud]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Import backend and cTrader SDK
        working-directory: backend
        env:
          JWT_SECRET: ci-only-not-for-production
          DATABASE_URL: postgresql://tradeguard:tradeguard@127.0.0.1:5432/tradeguard
        run: python -c "from app.main import app; from app.ctrader_service import ProtoOASpotEvent, ProtoOASubscribeSpotsReq, ProtoOAErrorRes; print('Backend app and cTrader Open API imports OK')"
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run backend unit tests when present
        working-directory: backend
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo 'No backend test modules found; compile check completed.'
          fi
