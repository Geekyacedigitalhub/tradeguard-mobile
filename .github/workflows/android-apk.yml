name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17 (required by Expo 54 / AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo config
        run: npx expo config --type public > /dev/null

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p android --no-install

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "no apk produced" >&2; exit 1; fi
          SIZE="$(du -h "$APK" | cut -f1)"
          cp "$APK" tradeguard-mobile-debug.apk
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($SIZE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeguard-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as direct-download release (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-apk-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          if gh release create "$TAG" tradeguard-mobile-debug.apk \
            --title "TradeGuard Android (debug APK)" \
            --notes "Install: open this file on your Android phone and allow 'Install unknown apps'. Built from \`${GITHUB_SHA}\`."; then
            echo "DIRECT DOWNLOAD: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/tradeguard-mobile-debug.apk"
          else
            echo "Release publish not permitted in this event context; the run artifact above still contains the APK."
          fi
