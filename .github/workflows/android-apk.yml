name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17 (required by Expo 54 / AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo config
        run: npx expo config --type public > /dev/null

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p android --no-install

      - name: Show Android build config (minSdk check)
        run: |
          echo "--- gradle.properties ---"
          grep -E "sdk|target" android/gradle.properties 2>/dev/null || true
          echo "--- app build.gradle (sdk) ---"
          grep -E "minSdk|targetSdk|compileSdk" android/app/build.gradle || true
          echo "--- installed Android build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Generate demo release signing key
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore tradeguard-demo-release.keystore -alias tradeguard -keyalg RSA -keysize 2048 -validity 10950 -storepass tradeguard-demo-2026 -keypass tradeguard-demo-2026 -dname "CN=TradeGuard Demo, OU=Mobile, O=TradeGuard, L=Lagos, C=NG"

      - name: Apply release signing to generated build.gradle
        env:
          TG_KEYSTORE: ../tradeguard-demo-release.keystore
          TG_KEYSTORE_PASS: tradeguard-demo-2026
        run: |
          python3 scripts/apply-release-signing.py
          grep -n "signingConfig signingConfigs" android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        env:
          # The production backend (tradeguard-api.fastapicloud.dev) is suspended.
          # Point the APK at the live demo backend until a real API is configured.
          EXPO_PUBLIC_API_URL: "https://8081-iohra9g8byq6b51k4qoku.e2b.app"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK integrity + signature + metadata
        id: apk
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            FOUND="$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)"
            if [ -n "$FOUND" ]; then APK="$FOUND"; fi
          fi
          echo "::notice title=APKDIAG::APK=$APK exists=$([ -f "$APK" ] && echo yes || echo no) ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "::notice title=APKDIAG-apkdir::$(ls -la android/app/build/outputs/apk/release/ 2>&1 | tr '\n' '|')"
          echo "::notice title=APKDIAG-buildtools::$(ls "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' ')"
          if [ ! -f "$APK" ]; then echo "::error title=APK-MISSING::No release APK under android/app/build/outputs/apk/release/" >&2; exit 1; fi
          SIZE="$(du -h "$APK" | cut -f1)"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          # 1) zip integrity (python3 is always available on runners)
          if python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); sys.exit(1 if bad is not None else 0)" "$APK"; then
            echo "zip integrity: OK"
          else
            echo "zip integrity: FAILED" >&2
            exit 1
          fi
          BT="$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -n1 || echo none)"
          # 2) signature verification — a release APK must be signed or the phone rejects it
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          if [ ! -x "$APKSIGNER" ]; then echo "apksigner not found in build-tools/$BT" >&2; exit 1; fi
          if "$APKSIGNER" verify --print-certs "$APK"; then
            echo "signature: OK (v1/v2 verified)"
          else
            echo "signature: FAILED — APK would be rejected on device" >&2
            exit 1
          fi
          # 3) Android package metadata (aapt or aapt2)
          AAPT=""
          if [ -x "$ANDROID_HOME/build-tools/$BT/aapt" ]; then
            AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          elif [ -x "$ANDROID_HOME/build-tools/$BT/aapt2" ]; then
            AAPT="$ANDROID_HOME/build-tools/$BT/aapt2"
          fi
          if [ -n "$AAPT" ]; then
            echo "--- aapt badging ---"
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|launchable-activity" || true
          else
            echo "aapt/aapt2 not found in build-tools/$BT - skipping badging"
          fi
          cp "$APK" "TradeGuard-v$(node -p "require('./package.json').version").apk"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($SIZE) sha256=$SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeguard-android-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as direct-download release (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          ASSET="TradeGuard-${VER}.apk"
          NOTES="Install: open this file on your Android phone and allow 'Install unknown apps'.
          Release-signed production build (not a debug build).
          Built from ${GITHUB_SHA} - run ${GITHUB_RUN_ID}
          Size: ${{ steps.apk.outputs.size }} - SHA256: ${{ steps.apk.outputs.sha }}
          Requires Android 7.0 (API 24) or newer."
          if gh release create "$VER" "$ASSET" \
            --title "TradeGuard ${VER}" \
            --notes "$NOTES"; then
            echo "DIRECT DOWNLOAD: https://github.com/${GITHUB_REPOSITORY}/releases/download/${VER}/${ASSET}"
          else
            echo "Release publish not permitted in this event context; the run artifact above still contains the APK."
          fi
