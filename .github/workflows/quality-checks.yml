name: TradeGuard Quality Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          if python -m unittest discover -s tests -v > /tmp/tradeguard-rt-tests.log 2>&1; then
            cat /tmp/tradeguard-rt-tests.log
          else
            echo "::error file=backend/tests,title=Backend tests failed (tail)::"
            tail -n 80 /tmp/tradeguard-rt-tests.log
            echo ""
            echo "::error file=backend/tests,title=Key package versions::"
            python -m pip freeze | grep -Ei '^(twisted|cryptography|fastapi|httpx|pydantic|uvicorn|ctrader|pyopenssl|protobuf)=' || true
            exit 1
          fi

  mobile-typecheck:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install mobile dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
