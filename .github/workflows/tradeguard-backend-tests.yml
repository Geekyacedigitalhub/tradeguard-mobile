name: TradeGuard backend tests

on:
  push:
    branches:
      - feature/selected-bot-configuration
    paths:
      - "backend/**"
      - ".github/workflows/tradeguard-backend-tests.yml"
  pull_request:
    branches:
      - feature/selected-bot-configuration
    paths:
      - "backend/**"
      - ".github/workflows/tradeguard-backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run backend regression tests
        working-directory: backend
        run: python -m pytest tests -q
