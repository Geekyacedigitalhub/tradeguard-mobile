// Injects release signing into the Expo-generated app module without
// modifying the template. Used by the Android APK workflow to produce a
// production-signed release APK (demo keystore generated per build).
gradle.projectsEvaluated {
  rootProject.allprojects { p ->
    try {
      if (p.name == 'app' && p.extensions.findByName('android') != null) {
        def android = p.extensions.getByName('android')
        def storeFile = rootProject.file(System.getenv('TG_KEYSTORE'))
        def storePass = System.getenv('TG_KEYSTORE_PASS')
        android.signingConfigs.create('tgrelease') {
          storeFile storeFile
          storePassword storePass
          keyAlias 'tradeguard'
          keyPassword storePass
        }
        android.buildTypes.getByName('release').signingConfig = android.signingConfigs.getByName('tgrelease')
        println "tg-release-signing: release build will be signed with ${storeFile}"
      }
    } catch (Throwable t) {
      println "tg-release-signing: FAILED to configure signing: ${t}"
      throw t
    }
  }
}
