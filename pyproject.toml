[project]
name = "tradeguard-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "psycopg[binary]==3.2.4",
  "httpx==0.28.1",
  # pyOpenSSL==24.1.0 (pinned by ctrader-open-api) requires cryptography<43;
  # keep this in sync with backend/pyproject.toml or the FastAPI Cloud
  # dependency resolution fails and every deploy is red.
  "cryptography==42.0.8",
  "ctrader-open-api==0.9.2",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"
